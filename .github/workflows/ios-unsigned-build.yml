# Build an unsigned Phoenix .ipa (testnet) for sideloading (Sideloadly / AltStore) with a free Apple ID.
# The sideloading tool re-signs the app with your own Apple ID.
name: iOS unsigned build

on:
  workflow_dispatch:
  push:
    branches: [ feature/nfc-tap-to-pay ]
    paths:
      - 'phoenix-ios/**'
      - 'phoenix-shared/**'
      - '.github/workflows/ios-unsigned-build.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Konan & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan
            ~/.gradle/caches
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Skip Android module
        run: echo "skip.android=true" > local.properties

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project phoenix-ios/phoenix-ios.xcodeproj \
            -scheme phoenix-ios \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -200

      # Ad-hoc sign with the entitlements a free Apple ID can get, so the sideloading tool knows
      # which ones to request. HCE, iCloud and push need a paid account and are dropped.
      - name: Package .ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          mkdir Payload && cp -R "$APP" Payload/
          APP="Payload/$(basename "$APP")"

          cp phoenix-ios/phoenix-ios/Phoenix.entitlements app.entitlements
          for key in aps-environment com.apple.developer.icloud-container-identifiers com.apple.developer.icloud-services \
                     com.apple.developer.nfc.hce com.apple.developer.nfc.hce.iso7816.select-identifier-prefixes; do
            plutil -remove "$key" app.entitlements
          done

          find "$APP" \( -name '*.framework' -o -name '*.dylib' \) -prune -exec codesign -f -s - {} \;
          for ext in "$APP"/PlugIns/*.appex; do
            codesign -f -s - --entitlements phoenix-ios/phoenix-notifySrvExt/phoenix-notifySrvExt.entitlements "$ext"
          done
          codesign -f -s - --entitlements app.entitlements "$APP"

          zip -qry Phoenix-testnet-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Phoenix-testnet-unsigned-ipa
          path: Phoenix-testnet-unsigned.ipa
